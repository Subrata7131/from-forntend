<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login page</title>
    <!-- <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script> -->
    <link rel="stylesheet" href="./src/output.css">

</head>

<body class="flex items-center justify-center flex-col h-dvh w-dvw flex-col bg-[#121314] text-white">

    <a href="./index.html" class="h-[69px] w-[69px] rounded-[20px] bg-white mr-[350px] flex items-center justify-center">
    <img class="h-[41px] w-[41px] object-contain" src="./asset/back.png" alt="arrow icon">
    </a>

    <form id ="loginForm">
        <h1 class="text-[36px] font-semibold text-white tracking-wide flex justify-center mb-[182px]">
                Signin
        </h1>
        <input class="h-[78px] w-[353px] block rounded-[44px] bg-[#1b0839] mb-[46px] text-[36px] px-6" id="email" placeholder="Email" required>
        <input class="h-[78px] w-[353px] block rounded-[44px] bg-[#1b0839] text-[36px] mb-[46px] px-6" id="password" type="password" placeholder="Password" required>
        <button type="Next" class="h-[78px] w-[353px] block rounded-[44px] bg-white text-[36px] mb-[46px] text-black" id="button">Next</button>
        
    </form>

    


    <script>
        const loginForm = document.getElementById("loginForm");

        loginForm.addEventListener("submit", async (event) => {

            event.preventDefault();

            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;


            const response = await fetch(
                "http://localhost:3001/from/login",
                {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        email: email,
                        password: password
                    })
                }
            );


            const result = await response.json();

            console.log(result);


            
            if (response.ok) {

                localStorage.setItem(
                    "user",
                    JSON.stringify(result.user)
                );

                console.log("USER SAVED:");
                console.log(localStorage.getItem("user"));

                window.location.href = "./dashboard.html";
            }

        });




    </script>
    
</body>
</html>
